syntax = "proto3";

package edge;
option go_package = "edge-app/internal/api/grpc/pb";

// ── Metric streaming ─────────────────────────────────────────────────────────

message StreamRequest {
  // Optional filter: only stream events for this metric key.
  // Leave empty to receive all metrics.
  string key_filter = 1;
}

message MetricEvent {
  int64  time   = 1; // Unix milliseconds
  string source = 2;
  string key    = 3;
  double value  = 4;
  bool   ok     = 5;
}

// ── Aggregate queries ─────────────────────────────────────────────────────────

message AggregateRequest {
  int64 window_ms = 1;
}

message Aggregate {
  int64  time      = 1;
  int64  window_ms = 2;
  string metric    = 3;
  double avg       = 4;
  double min       = 5;
  double max       = 6;
  int64  count     = 7;
}

message AggregateResponse {
  repeated Aggregate items = 1;
}

// ── Service ───────────────────────────────────────────────────────────────────

service EdgeService {
  // StreamMetrics opens a server-side stream that pushes every MetricEvent
  // from the fan-out bus to the client in real time.
  rpc StreamMetrics(StreamRequest) returns (stream MetricEvent);

  // GetAggregates returns the last N aggregates for a given time window.
  rpc GetAggregates(AggregateRequest) returns (AggregateResponse);
}
