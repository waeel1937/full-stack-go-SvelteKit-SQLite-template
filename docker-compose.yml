
services:
  backend:
    build:
      context: .
      dockerfile: edge-app/deploy/docker/Dockerfile
    container_name: edge-backend
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - edge-data:/opt/edge-app
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/status"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edge-frontend
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  edge-data:
