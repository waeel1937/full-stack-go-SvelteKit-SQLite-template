services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: edge-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD:-admin}
      - KC_HTTP_PORT=8180
      - KC_HEALTH_ENABLED=true
    ports:
      - "8180:8180"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8180"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: edge-app/deploy/docker/Dockerfile
    container_name: edge-backend
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8180}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-edge}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - CLOUD_SYNC_ENDPOINT=${CLOUD_SYNC_ENDPOINT:-}
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edge-frontend
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - HOST=0.0.0.0
      - PUBLIC_BACKEND_URL=${PUBLIC_BACKEND_URL:-http://localhost:8080}
      - PUBLIC_KC_URL=${PUBLIC_KC_URL:-http://localhost:8180}
      - PUBLIC_KC_REALM=${PUBLIC_KC_REALM:-edge}
      - PUBLIC_KC_CLIENT=${PUBLIC_KC_CLIENT:-edge-frontend}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
