services:
  backend:
    build: .
    container_name: backend
    env_file:
      - .env
    ports:
      - "8081:8081"
      - "9091:9091"
    volumes:
      - ./data:/app/data
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 2s
      retries: 5
    restart: unless-stopped
