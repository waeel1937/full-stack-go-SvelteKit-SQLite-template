name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go: vet + cross-compile for all targets ─────────────────────────────────
  go:
    name: Go Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build — linux/amd64 (mini-PC, IPC)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o dist/edge-app-amd64 ./edge-app/cmd/edge-app

      - name: Build — linux/arm64 (Raspberry Pi 4, RevPi 4)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" -o dist/edge-app-arm64 ./edge-app/cmd/edge-app

      - name: Build — linux/arm v7 (Raspberry Pi 3, RevPi 3)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -ldflags="-s -w" -o dist/edge-app-armv7 ./edge-app/cmd/edge-app

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: edge-app-binaries-${{ github.sha }}
          path: dist/
          retention-days: 14

  # ── Frontend: install + build ────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

  # ── Docker: build both images (no push on PR) ────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: edge-app/deploy/docker/Dockerfile
          push: false
          tags: edge-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: edge-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Integration: full stack health check ────────────────────────────────────
  integration:
    name: Integration Health Check
    runs-on: ubuntu-latest
    needs: [go, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Start stack
        run: docker compose up -d --build
        timeout-minutes: 5

      - name: Wait for backend
        run: |
          for i in $(seq 1 36); do
            echo "Attempt $i/36..."
            if curl -sf http://localhost:8080/health; then
              echo "Backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not start in time"
          exit 1

      - name: Backend health check
        run: curl -sf http://localhost:8080/health

      - name: Frontend reachable
        run: curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -E "^2"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100
